name: Ollama Inline PR Reviewer

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') }}
    runs-on: self-hosted
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Generate Inline PR Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          MODEL_NAME: "qwen2.5-coder:14b"
        run: |
          COMMIT_ID=$(gh pr view $PR_NUMBER --json headRefOid -q .headRefOid)
          DIFF=$(gh pr diff $PR_NUMBER)

          SYSTEM_PROMPT="You are an expert code reviewer. Analyze the provided Git diff and respond strictly in JSON matching this exact structure:
          {
            \"summary\": \"General overview of the PR\",
            \"comments\": [
              {
                \"path\": \"relative/path/to/file.ext\",
                \"line\": 15,
                \"body\": \"Description of the issue or improvement.\n\n\`\`\`suggestion\nreplacement_code_here\n\`\`\`\"
              }
            ]
          }
          
          Rules for review:
          1. Only reference line numbers that exist on the addition/modified side (RIGHT side) of the diff.
          2. When suggesting a code fix or improvement, always include a GitHub suggestion block inside the body field using this exact format:
             \`\`\`suggestion
             <replacement code>
             \`\`\`
          3. Do not include markdown headers or commentary outside the required JSON structure."

          PROMPT="Git Diff:\n\n$DIFF"

          PAYLOAD=$(jq -n \
            --arg model "$MODEL_NAME" \
            --arg system "$SYSTEM_PROMPT" \
            --arg prompt "$PROMPT" \
            '{model: $model, system: $system, prompt:$prompt, format: "json", stream: false}')

          RESPONSE=$(curl -s --max-time 120 http://localhost:11434/api/generate \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "=== RAW OLLAMA API RESPONSE ==="
          echo "$RESPONSE"
          echo "==============================="

          RAW_RESPONSE=$(echo "$RESPONSE" | jq -r '.response // empty')

          CLEAN_JSON=$(echo "$RAW_RESPONSE" | sed -e 's/^```json//' -e 's/^```//' -e 's/```$//')

          SUMMARY=$(echo "$CLEAN_JSON" | jq -r '.summary // "Automated Code Review"' 2>/dev/null || echo "Automated Code Review")
          COMMENTS=$(echo "$CLEAN_JSON" | jq -c '[.comments[]? | {path: .path, line: (.line | tonumber? // .line), side: "RIGHT", body: .body}]' 2>/dev/null || echo "[]")

          if [ -z "$COMMENTS" ] || [ "$COMMENTS" = "null" ]; then
            COMMENTS="[]"
          fi

          REVIEW_PAYLOAD=$(jq -n \
            --arg commit_id "$COMMIT_ID" \
            --arg body "$SUMMARY" \
            --argjson comments "$COMMENTS" \
            '{commit_id: $commit_id, body: $body, event: "COMMENT", comments: $comments}')

          echo "$REVIEW_PAYLOAD" > review.json

          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --input review.json
