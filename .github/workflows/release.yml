name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            cpack_gen: TGZ
          - name: Windows x64
            os: windows-latest
            cpack_gen: ZIP

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libfltk1.3-dev libcairo2-dev pkg-config libssl-dev libx11-dev

      - name: Build & Package (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cd build
          cpack -G ${{ matrix.platform.cpack_gen }} -C Release

      - name: Setup MSYS2 MinGW
        if: matrix.platform.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-fltk
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build & Package (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cd build
          cpack -G ${{ matrix.platform.cpack_gen }} -C Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minesync-${{ matrix.platform.name }}
          path: |
            build/*.zip
            build/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/*.zip
            build/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}